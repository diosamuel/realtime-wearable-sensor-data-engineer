services:

  # DATASET DOWNLOADER
  # Downloads and extracts the UCI Daily and Sports Activities dataset into ./data.
  dataset-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: wearable-spark:3.5.1
    container_name: tubes-setup
    volumes:
      - ./data:/data
    restart: "no"

  # MQTT BROKER
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: tubes-mqtt-broker
    hostname: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # KAFKA (KRaft Mode)
  # NOTE: confluentinc/cp-kafka not in local images - will pull from registry
  kafka-broker:
    image: confluentinc/cp-kafka:8.1.1
    hostname: broker
    container_name: tubes-kafka-broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      TZ: UTC
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # SCHEMA REGISTRY
  # NOTE: confluentinc/cp-schema-registry not in local images - will pull from registry
  kafka-schema-registry:
    image: confluentinc/cp-schema-registry:8.1.1
    hostname: schema-registry
    container_name: tubes-kafka-schema-registry
    depends_on:
      - kafka-broker
    ports:
      - "8083:8081"
    environment:
      TZ: UTC
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # KAFKA UI
  # NOTE: provectuslabs/kafka-ui not in local images - will pull from registry
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tubes-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka-broker
      - kafka-schema-registry
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # MINIO (S3 STORAGE)
  # Local image: minio/minio:latest
  minio:
    image: minio/minio:latest
    container_name: tubes-minio
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

  # SPARK MASTER
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: wearable-spark:3.5.1
    container_name: tubes-spark-master
    hostname: spark-master
    depends_on:
      dataset-downloader:
        condition: service_completed_successfully
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_MODE: master
      SPARK_NO_DAEMONIZE: "true"
      HOME: /tmp
      SPARK_SUBMIT_OPTS: "-Dspark.jars.ivy=/tmp/.ivy2 -Divy.home=/tmp/.ivy2 -Divy.cache.dir=/tmp/.ivy2/cache"
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      MINIO_BUCKET: wearable-sensor-demo
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data:/opt/spark-data
      - ./data:/data
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

  # SPARK WORKER
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: wearable-spark:3.5.1
    container_name: tubes-spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_NO_DAEMONIZE: "true"
      HOME: /tmp
      SPARK_SUBMIT_OPTS: "-Dspark.jars.ivy=/tmp/.ivy2 -Divy.home=/tmp/.ivy2 -Divy.cache.dir=/tmp/.ivy2/cache"
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      MINIO_BUCKET: wearable-sensor-demo
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data:/opt/spark-data
      - ./data:/data
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

  # POSTGRES OLAP
  # Local image: postgres:15
  postgres:
    image: postgres:15
    container_name: tubes-postgres-olap
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: warehouse
    volumes:
      - ./postgres/data:/var/lib/postgresql/data

  # AIRFLOW POSTGRES
  # Local image: postgres:15
  airflow-postgres:
    image: postgres:15
    container_name: tubes-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./airflow/postgres:/var/lib/postgresql/data

  # AIRFLOW WEBSERVER
  # Local image: apache/airflow:2.9.1
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: tubes-airflow-webserver
    depends_on:
      - airflow-postgres
    ports:
      - "8084:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/data
    command: >
      bash -c "
      airflow db upgrade &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true &&
      airflow webserver
      "

  # AIRFLOW SCHEDULER
  # Local image: apache/airflow:2.9.1
  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: tubes-airflow-scheduler
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./data:/data
    command: airflow scheduler

  # REALTIME SENSOR SIMULATOR
  sensor-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: wearable-spark:3.5.1
    container_name: tubes-sensor-simulator
    hostname: sensor-simulator
    depends_on:
      - mqtt-broker
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: simulate/sensor
      PUBLISH_INTERVAL_SECONDS: 1
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: python3 simulate/sensor.py
    restart: unless-stopped

  # MQTT TO KAFKA BRIDGE
  mqtt-to-kafka:
    build:
      context: .
      dockerfile: Dockerfile
    image: wearable-spark:3.5.1
    container_name: tubes-mqtt-to-kafka
    hostname: mqtt-to-kafka
    depends_on:
      - mqtt-broker
      - kafka-broker
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: simulate/sensor
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_TOPIC: wearable.sensor.raw
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./data:/data
    working_dir: /opt/spark-apps/ingest
    command: python3 mqttToKafka.py
    restart: unless-stopped
